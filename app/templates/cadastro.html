<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro - TourCheck</title>
        <style>
            body { font-family: Tahoma, sans-serif; margin: 0; background: #f5f7fb; color: #010501; }

            header {
                display: flex;
                align-items: center;
                justify-content: right;
                position: relative;
                padding: 12px 24px;
                background: #1a6b3a;
                border-bottom: 1px solid #145c30;
            }
            .header-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
            }
            .header-brand img { height: 36px; width: 36px; object-fit: contain; }
            .header-brand span { color: #ffffff; font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }
            .header-actions { display: flex; align-items: center; gap: 10px; }

            button, .button {
                border: 0;
                border-radius: 6px;
                padding: 9px 16px;
                background: #1a6b3a;
                color: white;
                cursor: pointer;
                text-decoration: none;
                font-size: 14px;
                display: inline-block;
            }
            button.secondary, .button.secondary {
                background: rgba(255,255,255,0.15);
                color: #ffffff;
                border: 1px solid rgba(255,255,255,0.35);
            }
            button.secondary:hover, .button.secondary:hover { background: rgba(255,255,255,0.25); }

            .page-center {
                min-height: calc(100vh - 62px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .cadastro-box {
                background: #ffffff;
                border: 1px solid #d9e0ea;
                border-radius: 10px;
                padding: 36px 40px;
                width: 100%;
                max-width: 420px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            }
            .cadastro-box h1 { margin: 0 0 6px; font-size: 22px; }
            .cadastro-box p.subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; }

            .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
            .form-group label { font-size: 14px; font-weight: bold; }
            .form-group input {
                padding: 10px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }
            .form-group input:focus { border-color: #1a6b3a; }
            .form-group .hint { font-size: 12px; color: #94a3b8; margin: 0; }

            .btn-submit {
                width: 100%;
                padding: 11px;
                background: #1a6b3a;
                color: white;
                border: 0;
                border-radius: 6px;
                font-size: 15px;
                cursor: pointer;
                margin-top: 4px;
            }
            .btn-submit:hover { background: #145c30; }

            .cadastro-box .rodape { margin-top: 18px; font-size: 14px; text-align: center; color: #64748b; }
            .cadastro-box .rodape a { color: #1a6b3a; text-decoration: none; font-weight: bold; }

            #mensagem { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
        </style>
    </head>
    <body>
        <header>
            <div class="header-brand">
                <span><a href="/" style="text-decoration: none; color: inherit;">TourCheck</a></span>
                <img src="https://i.imgur.com/5WSo4a3.png">
            </div>
            <div class="header-actions">
                <a class="button secondary" href="/login">Login</a>
                <a class="button secondary" href="/cadastro" style="margin-left:8px">Registrar</a>
            </div>
        </header>

        <div class="page-center">
            <div class="cadastro-box">
                <h1>Criar conta</h1>
                <p class="subtitle">Preencha os dados para se cadastrar</p>

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone <span style="font-weight:normal;color:#94a3b8">(opcional)</span></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required minlength="6">
                    <p class="hint">Mínimo de 6 caracteres</p>
                </div>

                <button class="btn-submit" id="btn-cadastrar" type="button">Cadastrar</button>

                <p id="mensagem"></p>

                <p class="rodape">Já tem uma conta? <a href="/login">Faça login</a></p>
            </div>
        </div>

        <script>
            document.getElementById('btn-cadastrar').addEventListener('click', async function() {
                const telefone = document.getElementById('telefone').value

                const dados = {
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                    telefones: telefone ? [{ numero: telefone, tipo: "celular" }] : []
                }

                try {
                    const resposta = await fetch('/auth/cadastro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dados)
                    })

                    let resultado
                    try {
                        resultado = await resposta.json()
                    } catch {
                        document.getElementById('mensagem').textContent = 'Resposta inválida do servidor.'
                        document.getElementById('mensagem').style.color = 'red'
                        return
                    }

                    if (resposta.ok) {
                        document.getElementById('mensagem').textContent = 'Cadastro realizado com sucesso!'
                        document.getElementById('mensagem').style.color = 'green'
                        setTimeout(() => window.location.href = '/login', 1000)
                    } else {
                        const detalhe = typeof resultado.detail === 'string'
                            ? resultado.detail
                            : 'Erro ao cadastrar. Verifique os dados informados.'
                        document.getElementById('mensagem').textContent = detalhe
                        document.getElementById('mensagem').style.color = 'red'
                    }
                } catch (erro) {
                    document.getElementById('mensagem').textContent = 'Erro de conexão com o servidor.'
                    document.getElementById('mensagem').style.color = 'red'
                }
            })
        </script>
    </body>
</html>
