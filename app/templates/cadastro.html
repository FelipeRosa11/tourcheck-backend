<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro - TourCheck</title>
    </head>
    <body>
        <h1>Cadastro</h1>

        <form id="form-cadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
            <br><br>

            <label for="senha">Senha (minimo 6 caracteris):</label>
            <input type="password" id="senha" name="senha" required minlength="6">
            <br><br>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>

        <script>
            document.getElementById('form-cadastro').addEventListener('submit', async function(e) {
                e.preventDefault()  // impede o envio padrão do form

                const telefone = document.getElementById('telefone').value

                const dados = {
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                    telefones: telefone ? [{ numero: telefone, tipo: "celular" }] : []
                }

                try {
                    const resposta = await fetch('/auth/cadastro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dados)
                    })

                    const resultado = await resposta.json()

                    if (resposta.ok) {
                        document.getElementById('mensagem').textContent = 'Cadastro realizado com sucesso!'
                        document.getElementById('mensagem').style.color = 'green'
                        // redireciona para login após 1 segundo
                        setTimeout(() => window.location.href = '/login', 1000)
                    } else {
                        document.getElementById('mensagem').textContent = resultado.detail || 'Erro ao cadastrar.'
                        document.getElementById('mensagem').style.color = 'red'
                    }
                } catch (erro) {
                    document.getElementById('mensagem').textContent = 'Erro de conexão com o servidor.'
                    document.getElementById('mensagem').style.color = 'red'
                }
            })
        </script>
    </body>
</html>
