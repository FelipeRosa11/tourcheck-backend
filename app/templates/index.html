<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourCheck</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
        header { display: flex; gap: 12px; align-items: center; padding: 16px 24px; background: #ffffff; border-bottom: 1px solid #d9e0ea; flex-wrap: wrap; }
        main { max-width: 1040px; margin: 0 auto; padding: 28px 20px; }
        button, .button { border: 0; border-radius: 6px; padding: 10px 14px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; font-size: 14px; }
        button.secondary, .button.secondary { background: #e5e7eb; color: #111827; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .toolbar input { flex: 1; min-width: 180px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .toolbar select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .card { background: white; border: 1px solid #d9e0ea; border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 150px; object-fit: cover; background: #e5e7eb; }
        .card-content { padding: 14px; }
        .card h3 { margin: 0 0 8px; }
        .muted { color: #64748b; }
        .status { margin-top: 12px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    </style>
</head>
<body>
    <header>
        <a class="button" href="/ponto_cadastro">Cadastrar Ponto</a>
        <span id="botoes-auth">
            <a class="button secondary" href="/login">Login</a>
            <a class="button secondary" href="/cadastro">Registrar</a>
        </span>
        <a id="link-admin" class="button secondary" href="/admin" style="display:none">Admin</a>
        <button id="btn-salvos" class="secondary" style="display:none" onclick="carregarSalvos()">Meus salvos</button>
        <button id="btn-logout" class="secondary" style="display:none" onclick="logout()">Sair</button>
    </header>

    <main>
        <h1>TourCheck</h1>
        <p class="muted">Descubra, salve e cadastre pontos turisticos.</p>

        <form class="toolbar" id="form-busca">
            <input type="search" id="busca" placeholder="Buscar por nome, cidade, bairro ou categoria">
            <select id="ordenar">
                <option value="nome">Ordenar por nome</option>
                <option value="avaliacao_desc">Maior avaliacao</option>
                <option value="avaliacao_asc">Menor avaliacao</option>
            </select>
            <button type="submit">Buscar</button>
            <button type="button" class="secondary" onclick="carregarPontos()">Todos</button>
        </form>

        <div id="status" class="status">Carregando pontos...</div>
        <section id="lista-pontos" class="grid"></section>
    </main>

    <script>
        const token = localStorage.getItem('access_token')
        let mostrandoSalvos = false

        if (token) {
            document.getElementById('botoes-auth').style.display = 'none'
            document.getElementById('btn-logout').style.display = 'inline'
            document.getElementById('btn-salvos').style.display = 'inline'
            verificarPerfil()
        }

        function logout() {
            localStorage.removeItem('access_token')
            localStorage.removeItem('tipo_usuario')
            window.location.href = '/login'
        }

        async function verificarPerfil() {
            try {
                const resposta = await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                if (!resposta.ok) return

                const usuario = await resposta.json()
                const tipo = String(usuario.tipo || '').toLowerCase()
                localStorage.setItem('tipo_usuario', tipo)

                if (tipo === 'admin') {
                    document.getElementById('link-admin').style.display = 'inline'
                }
            } catch (erro) {
                console.error('Nao foi possivel verificar perfil.', erro)
            }
        }

        function escaparHtml(valor) {
            const div = document.createElement('div')
            div.textContent = valor || ''
            return div.innerHTML
        }

        async function buscarJson(url, opcoes = {}) {
            const headers = { ...(opcoes.headers || {}) }
            if (token) {
                headers.Authorization = `Bearer ${token}`
            }
            const resposta = await fetch(url, { ...opcoes, headers })
            const texto = await resposta.text()
            const dados = texto ? JSON.parse(texto) : null
            return { resposta, dados }
        }

        async function alterarSalvo(pontoId, salvar) {
            try {
                const { resposta, dados } = await buscarJson(`/pontos/${pontoId}/salvar`, {
                    method: salvar ? 'POST' : 'DELETE'
                })
                if (!resposta.ok) {
                    alert(dados?.detail || 'Nao foi possivel atualizar os salvos.')
                    return
                }
                if (mostrandoSalvos) {
                    carregarSalvos()
                } else {
                    carregarPontos(document.getElementById('busca').value.trim())
                }
            } catch (erro) {
                alert('Erro de conexao com o servidor.')
            }
        }

        function renderizarPontos(pontos) {
            const lista = document.getElementById('lista-pontos')
            lista.innerHTML = ''

            pontos.forEach(ponto => {
                const item = document.createElement('article')
                item.className = 'card'
                const textoSalvar = ponto.salvo ? 'Remover salvo' : 'Salvar'
                const acaoSalvar = ponto.salvo ? `alterarSalvo(${ponto.id}, false)` : `alterarSalvo(${ponto.id}, true)`
                item.innerHTML = `
                    ${ponto.imagem_url ? `<img src="${escaparHtml(ponto.imagem_url)}" alt="${escaparHtml(ponto.nome)}">` : ''}
                    <div class="card-content">
                        <h3>${escaparHtml(ponto.nome)}</h3>
                        <p class="muted">${escaparHtml(ponto.categoria)} - ${escaparHtml(ponto.cidade)}${ponto.bairro ? `, ${escaparHtml(ponto.bairro)}` : ''}</p>
                        <p>${escaparHtml(ponto.descricao)}</p>
                        <p><strong>Avaliacao:</strong> ${ponto.media_avaliacoes} (${ponto.total_avaliacoes})</p>
                        <div class="actions">
                            <a class="button secondary" href="/ponto/${ponto.id}">Ver detalhes</a>
                            ${token ? `<button class="secondary" onclick="${acaoSalvar}">${textoSalvar}</button>` : ''}
                        </div>
                    </div>
                `
                lista.appendChild(item)
            })
        }

        async function carregarPontos(busca = '') {
            const lista = document.getElementById('lista-pontos')
            const status = document.getElementById('status')
            lista.innerHTML = ''
            status.textContent = 'Carregando pontos...'
            mostrandoSalvos = false

            try {
                const params = new URLSearchParams()
                if (busca) params.set('busca', busca)
                params.set('ordenar', document.getElementById('ordenar').value)

                const { resposta, dados: pontos } = await buscarJson(`/pontos?${params.toString()}`)
                if (!resposta.ok) {
                    status.textContent = pontos?.detail || 'Erro ao carregar pontos.'
                    return
                }

                if (pontos.length === 0) {
                    status.textContent = 'Nenhum ponto turistico encontrado.'
                    return
                }

                status.textContent = `${pontos.length} ponto(s) encontrado(s).`
                renderizarPontos(pontos)
            } catch (erro) {
                status.textContent = 'Erro de conexao com o servidor.'
            }
        }

        async function carregarSalvos() {
            const lista = document.getElementById('lista-pontos')
            const status = document.getElementById('status')
            lista.innerHTML = ''
            status.textContent = 'Carregando pontos salvos...'
            mostrandoSalvos = true

            try {
                const { resposta, dados: pontos } = await buscarJson('/pontos/salvos/me')
                if (!resposta.ok) {
                    status.textContent = pontos?.detail || 'Erro ao carregar salvos.'
                    return
                }

                if (pontos.length === 0) {
                    status.textContent = 'Voce ainda nao salvou pontos turisticos.'
                    return
                }

                status.textContent = `${pontos.length} ponto(s) salvo(s).`
                renderizarPontos(pontos)
            } catch (erro) {
                status.textContent = 'Erro de conexao com o servidor.'
            }
        }

        document.getElementById('form-busca').addEventListener('submit', function(event) {
            event.preventDefault()
            carregarPontos(document.getElementById('busca').value.trim())
        })

        document.getElementById('ordenar').addEventListener('change', function() {
            carregarPontos(document.getElementById('busca').value.trim())
        })

        carregarPontos()
    </script>
</body>
</html>
