<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ponto Turistico - TourCheck</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
        main { max-width: 720px; margin: 0 auto; padding: 28px 20px; }
        a { color: #2563eb; }
        form { display: grid; gap: 14px; background: white; border: 1px solid #d9e0ea; border-radius: 8px; padding: 18px; }
        label { display: grid; gap: 6px; font-weight: 600; }
        input, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        textarea { min-height: 110px; resize: vertical; }
        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        button { border: 0; border-radius: 6px; padding: 11px 16px; background: #2563eb; color: white; cursor: pointer; font-size: 15px; }
        #mensagem { font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <a href="/">Voltar para pontos</a>
        <h1>Cadastro de Ponto Turistico</h1>

        <form id="form-ponto">
            <label>Nome
                <input type="text" id="nome" required minlength="3" maxlength="120">
            </label>

            <label>Descricao
                <textarea id="descricao" required minlength="10"></textarea>
            </label>

            <div class="row">
                <label>Categoria
                    <input type="text" id="categoria" required minlength="2" maxlength="60">
                </label>
                <label>Cidade
                    <input type="text" id="cidade" required minlength="2" maxlength="80">
                </label>
            </div>

            <div class="row">
                <label>Bairro
                    <input type="text" id="bairro" maxlength="80">
                </label>
                <label>Endereco
                    <input type="text" id="endereco" maxlength="255">
                </label>
            </div>

            <div class="row">
                <label>Latitude
                    <input type="number" step="any" id="latitude" min="-90" max="90">
                </label>
                <label>Longitude
                    <input type="number" step="any" id="longitude" min="-180" max="180">
                </label>
            </div>

            <label>URL da imagem
                <input type="url" id="imagem_url" placeholder="https://...">
            </label>

            <button type="submit">Salvar ponto</button>
        </form>

        <p id="mensagem"></p>
    </main>

    <script>
        const token = localStorage.getItem('access_token')
        if (!token) {
            window.location.href = '/login'
        }

        function valorOuNulo(id) {
            const valor = document.getElementById(id).value.trim()
            return valor || null
        }

        document.getElementById('form-ponto').addEventListener('submit', async function(event) {
            event.preventDefault()

            const dados = {
                nome: valorOuNulo('nome'),
                descricao: valorOuNulo('descricao'),
                categoria: valorOuNulo('categoria'),
                cidade: valorOuNulo('cidade'),
                bairro: valorOuNulo('bairro'),
                endereco: valorOuNulo('endereco'),
                latitude: valorOuNulo('latitude') ? parseFloat(valorOuNulo('latitude')) : null,
                longitude: valorOuNulo('longitude') ? parseFloat(valorOuNulo('longitude')) : null,
                imagem_url: valorOuNulo('imagem_url'),
            }

            const mensagem = document.getElementById('mensagem')
            mensagem.textContent = 'Salvando ponto...'
            mensagem.style.color = '#1f2937'

            try {
                const resposta = await fetch('/pontos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(dados)
                })

                const resultado = await resposta.json()

                if (resposta.ok) {
                    mensagem.textContent = resultado.status === 'aprovado'
                        ? 'Ponto cadastrado com sucesso!'
                        : 'Ponto enviado para aprovacao com sucesso!'
                    mensagem.style.color = 'green'
                    setTimeout(() => window.location.href = `/ponto/${resultado.id}`, 800)
                } else {
                    mensagem.textContent = Array.isArray(resultado.detail)
                        ? resultado.detail.map(erro => erro.msg).join(' | ')
                        : resultado.detail || 'Erro ao cadastrar ponto.'
                    mensagem.style.color = 'red'
                }
            } catch (erro) {
                mensagem.textContent = 'Erro de conexao com o servidor.'
                mensagem.style.color = 'red'
            }
        })
    </script>
</body>
</html>
