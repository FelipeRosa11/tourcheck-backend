<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ponto Turístico - TourCheck</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; background: #f5f7fb; color: #010501; }

        header {
            display: flex;
            align-items: center;
            justify-content: right;
            position: relative;
            padding: 12px 24px;
            background: #1a6b3a;
            border-bottom: 1px solid #145c30;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .header-brand img { height: 36px; width: 36px; object-fit: contain; }
        .header-brand span { color: #ffffff; font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        button, .button {
            border: 0;
            border-radius: 6px;
            padding: 9px 16px;
            background: #1a6b3a;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }
        button.secondary, .button.secondary {
            background: rgba(255,255,255,0.15);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.35);
        }
        button.secondary:hover, .button.secondary:hover { background: rgba(255,255,255,0.25); }

        .page-center {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 36px 24px;
            min-height: calc(100vh - 62px);
        }
        .form-box {
            background: #ffffff;
            border: 1px solid #d9e0ea;
            border-radius: 10px;
            padding: 36px 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .form-box h1 { margin: 0 0 6px; font-size: 22px; }
        .form-box p.subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; }

        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 14px; font-weight: bold; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: #1a6b3a; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group .optional { font-weight: normal; color: #94a3b8; }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #1a6b3a;
            color: white;
            border: 0;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-submit:hover { background: #145c30; }

        .form-box .rodape { margin-top: 18px; font-size: 14px; text-align: center; color: #64748b; }
        .form-box .rodape a { color: #1a6b3a; text-decoration: none; font-weight: bold; }

        #mensagem { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }

        .section-divider {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.8px;
            margin: 20px 0 12px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <span><a href="/" style="text-decoration: none; color: inherit;">TourCheck</a></span>
            <img src="https://i.imgur.com/5WSo4a3.png" referrerpolicy="no-referrer" alt="TourCheck logo">        
        </div>
        <div class="header-actions">
            <span id="botoes-auth">
                <a class="button secondary" href="/login">Login</a>
                <a class="button secondary" href="/cadastro" style="margin-left:8px">Registrar</a>
            </span>
            <a id="link-admin" class="button secondary" href="/admin" style="display:none">Admin</a>
            <button id="btn-logout" class="secondary" style="display:none" onclick="logout()">Sair</button>
        </div>
    </header>

    <div class="page-center">
        <div class="form-box">
            <h1 id="titulo-form">Cadastrar Ponto</h1>
            <p class="subtitle" id="subtitulo-form">Preencha as informações do ponto turístico</p>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Nome do ponto turístico" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" placeholder="Descreva o ponto turístico..." required></textarea>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="">-- Selecione uma categoria --</option>
                    <option value="Monumento">Monumento</option>
                    <option value="Natureza">Natureza</option>
                    <option value="Cultura">Cultura</option>
                    <option value="Gastronomia">Gastronomia</option>
                    <option value="Entretenimento">Entretenimento</option>
                    <option value="Religioso">Religioso</option>
                    <option value="Historico">Histórico</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <p class="section-divider">Localização</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Ex: Rio de Janeiro" required>
                </div>
                <div class="form-group">
                    <label for="bairro">Bairro <span class="optional">(opcional)</span></label>
                    <input type="text" id="bairro" placeholder="Ex: Centro">
                </div>
            </div>

            <div class="form-group">
                <label for="endereco">Endereço <span class="optional">(opcional)</span></label>
                <input type="text" id="endereco" placeholder="Rua, número...">
            </div>

            <p class="section-divider">Mídia</p>

            <div class="form-group">
                <label for="imagem_url">URL da Imagem <span class="optional">(opcional)</span></label>
                <input type="url" id="imagem_url" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="imagens_arquivo">Imagens do computador <span class="optional">(opcional)</span></label>
                <input type="file" id="imagens_arquivo" accept="image/*" multiple>
            </div>

            <button class="btn-submit" id="btn-enviar" type="button">Enviar para aprovação</button>

            <p id="mensagem"></p>

            <p class="rodape"><a href="/">Voltar para a página inicial</a></p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token')
        if (!token) window.location.href = '/login'
        const paramsPagina = new URLSearchParams(window.location.search)
        const pontoEditandoId = paramsPagina.get('editar')
        let imagensExistentes = []

        // Atualiza header conforme autenticação
        if (token) {
            document.getElementById('botoes-auth').style.display = 'none'
            document.getElementById('btn-logout').style.display = 'inline'
            verificarPerfil()
        }

        function logout() {
            localStorage.removeItem('access_token')
            localStorage.removeItem('tipo_usuario')
            window.location.href = '/login'
        }

        async function verificarPerfil() {
            try {
                const resposta = await fetch('/auth/me', { headers: { 'Authorization': `Bearer ${token}` } })
                if (!resposta.ok) return
                const usuario = await resposta.json()
                const tipo = String(usuario.tipo || '').toLowerCase()
                localStorage.setItem('tipo_usuario', tipo)
                if (tipo === 'admin') document.getElementById('link-admin').style.display = 'inline'
            } catch (e) {}
        }

        async function carregarPontoParaEdicao() {
            if (!pontoEditandoId) return

            document.getElementById('titulo-form').textContent = 'Editar Ponto'
            document.getElementById('subtitulo-form').textContent = 'A versão editada será enviada para validação.'
            document.getElementById('btn-enviar').textContent = 'Enviar edição para validação'

            const mensagemEl = document.getElementById('mensagem')
            try {
                const resposta = await fetch(`/pontos/${pontoEditandoId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                const ponto = await resposta.json()
                if (!resposta.ok) {
                    mensagemEl.textContent = ponto.detail || 'Não foi possível carregar o ponto.'
                    mensagemEl.style.color = 'red'
                    return
                }

                document.getElementById('nome').value = ponto.nome || ''
                document.getElementById('descricao').value = ponto.descricao || ''
                document.getElementById('categoria').value = ponto.categoria || ''
                document.getElementById('cidade').value = ponto.cidade || ''
                document.getElementById('bairro').value = ponto.bairro || ''
                document.getElementById('endereco').value = ponto.endereco || ''
                document.getElementById('imagem_url').value = ponto.imagem_url || ''
                imagensExistentes = ponto.imagens_urls || []
            } catch (erro) {
                mensagemEl.textContent = 'Erro de conexão com o servidor.'
                mensagemEl.style.color = 'red'
            }
        }

        document.getElementById('btn-enviar').addEventListener('click', async function() {
            const mensagemEl = document.getElementById('mensagem')

            const categoria = document.getElementById('categoria').value
            if (!categoria) {
                mensagemEl.textContent = 'Selecione uma categoria.'
                mensagemEl.style.color = 'red'
                return
            }

            let imagensUrls = pontoEditandoId ? [...imagensExistentes] : []
            const arquivos = document.getElementById('imagens_arquivo').files
            if (arquivos.length > 0) {
                const formData = new FormData()
                Array.from(arquivos).forEach(arquivo => formData.append('imagens', arquivo))

                mensagemEl.textContent = 'Enviando imagens...'
                mensagemEl.style.color = '#1a6b3a'

                const respostaUpload = await fetch('/pontos/imagens', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                })
                const resultadoUpload = await respostaUpload.json()
                if (!respostaUpload.ok) {
                    mensagemEl.textContent = resultadoUpload.detail || 'Erro ao enviar imagens.'
                    mensagemEl.style.color = 'red'
                    return
                }
                imagensUrls = resultadoUpload.imagens_urls || []
            }

            const imagemUrlDigitada = document.getElementById('imagem_url').value || null
            if (imagemUrlDigitada) imagensUrls.unshift(imagemUrlDigitada)
            imagensUrls = [...new Set(imagensUrls.filter(Boolean))]

            const dados = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                categoria: categoria,
                cidade: document.getElementById('cidade').value,
                bairro: document.getElementById('bairro').value || null,
                endereco: document.getElementById('endereco').value || null,
                imagem_url: imagensUrls[0] || null,
                imagens_urls: imagensUrls,
            }

            try {
                const resposta = await fetch(pontoEditandoId ? `/pontos/${pontoEditandoId}` : '/pontos', {
                    method: pontoEditandoId ? 'PATCH' : 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(dados)
                })

                let resultado
                try {
                    resultado = await resposta.json()
                } catch {
                    mensagemEl.textContent = 'Resposta inválida do servidor.'
                    mensagemEl.style.color = 'red'
                    return
                }

                if (resposta.ok) {
                    mensagemEl.textContent = pontoEditandoId ? 'Edição enviada para validação!' : 'Ponto enviado para aprovação!'
                    mensagemEl.style.color = 'green'
                    setTimeout(() => window.location.href = pontoEditandoId ? `/ponto/${pontoEditandoId}` : '/', 1500)
                } else {
                    const detalhe = typeof resultado.detail === 'string'
                        ? resultado.detail
                        : 'Erro ao cadastrar ponto. Verifique os dados informados.'
                    mensagemEl.textContent = detalhe
                    mensagemEl.style.color = 'red'
                }
            } catch (erro) {
                mensagemEl.textContent = 'Erro de conexão com o servidor.'
                mensagemEl.style.color = 'red'
            }
        })

        carregarPontoParaEdicao()
    </script>
</body>
</html>
